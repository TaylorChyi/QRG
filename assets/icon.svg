<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">QRG</title>
  <desc id="desc">Three ivory QR finder patterns and mint tiles on a forest-green rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#206859"/>
      <stop offset="1" stop-color="#093030"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#051e20" flood-opacity="0.22"/>
    </filter>
    <mask id="eyes">
      <rect width="1024" height="1024" fill="black"/>
      <rect x="232" y="232" width="224" height="224" rx="54" fill="white"/>
      <rect x="272" y="272" width="144" height="144" rx="20" fill="black"/>
      <rect x="312" y="312" width="64" height="64" rx="12" fill="white"/>
      <rect x="568" y="232" width="224" height="224" rx="54" fill="white"/>
      <rect x="608" y="272" width="144" height="144" rx="20" fill="black"/>
      <rect x="648" y="312" width="64" height="64" rx="12" fill="white"/>
      <rect x="232" y="568" width="224" height="224" rx="54" fill="white"/>
      <rect x="272" y="608" width="144" height="144" rx="20" fill="black"/>
      <rect x="312" y="648" width="64" height="64" rx="12" fill="white"/>
    </mask>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="188" fill="url(#background)" filter="url(#shadow)"/>
  <rect width="1024" height="1024" fill="#f7fff9" mask="url(#eyes)"/>
  <rect x="568" y="568" width="64" height="64" rx="12" fill="#79f2c0"/>
  <rect x="728" y="568" width="64" height="64" rx="12" fill="#79f2c0"/>
  <rect x="568" y="648" width="64" height="64" rx="12" fill="#79f2c0"/>
  <rect x="648" y="648" width="64" height="64" rx="12" fill="#79f2c0"/>
  <rect x="648" y="728" width="64" height="64" rx="12" fill="#79f2c0"/>
  <rect x="728" y="728" width="64" height="64" rx="12" fill="#79f2c0"/>
</svg>

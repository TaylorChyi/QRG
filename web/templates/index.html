<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="在浏览器中制作和导出可定制的二维码。">
  <title>QRG · 二维码生成器</title>
  <link rel="icon" type="image/png" href="{{ url_for('icon') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="QRG">
        <img class="brand-icon" src="{{ url_for('icon') }}" alt="" width="26" height="26">
        <span>QRG</span>
      </div>
      <div class="topbar-right"><span class="topbar-caption">QR CODE STUDIO</span><label class="theme-control" for="theme">外观 <select id="theme" aria-label="界面外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label></div>
    </header>

    <main class="workspace">
      <section class="editor" aria-labelledby="editor-title">
        <div class="intro"><p class="eyebrow">CREATE / 01</p><h1 id="editor-title">制作你的二维码</h1><p>输入链接或文字，调整细节。预览会随修改自动更新。</p></div>

        <form id="editor-form" novalidate>
          <fieldset class="panel"><legend><span class="section-number">01</span> 内容</legend>
            <div class="field"><label for="content">链接或文字</label><textarea id="content" rows="3" placeholder="https://example.com" spellcheck="false" maxlength="4096"></textarea><span class="field-note">内容会发送到当前 QRG 服务器生成二维码；不会转发至第三方二维码服务。</span></div>
          </fieldset>

          <fieldset class="panel"><legend><span class="section-number">02</span> 外观</legend>
            <div class="field-grid">
              <div class="field"><label for="color">码颜色</label><div class="colour-field"><input id="color" type="color" value="#000000"><output id="color-value" for="color">#000000</output></div></div>
              <div class="field"><label for="background">背景颜色</label><div class="colour-field"><input id="background" type="color" value="#ffffff"><output id="background-value" for="background">#ffffff</output></div></div>
            </div>
            <label class="check-row" for="transparent"><input id="transparent" type="checkbox"><span>透明背景</span></label>
            <div class="field-grid">
              <div class="field"><label for="module-shape">码点形状</label><select id="module-shape"><option value="square">方形</option><option value="tile" selected>圆角瓷砖</option><option value="circle">圆形</option></select></div>
              <div class="field"><label for="eye-shape">码眼形状</label><select id="eye-shape"><option value="square">方形</option><option value="rounded" selected>中圆角</option></select></div>
            </div>
          </fieldset>

          <fieldset class="panel"><legend><span class="section-number">03</span> 规格</legend>
            <div class="field-grid">
              <div class="field"><label for="error-correction">容错等级</label><select id="error-correction"><option value="L">L · 低</option><option value="M">M · 中</option><option value="Q">Q · 高</option><option value="H" selected>H · 最高</option></select></div>
              <div class="field"><label for="version">二维码版本</label><select id="version"><option value="auto">自动选择</option></select></div>
              <div class="field"><label for="margin">边距（码点）</label><input id="margin" type="number" min="0" max="32" step="1" value="4" inputmode="numeric"></div>
              <div class="field"><label for="size">尺寸（像素）</label><input id="size" type="number" min="64" max="4096" step="1" value="1024" inputmode="numeric"></div>
            </div>
            <label class="check-row" for="crisp"><input id="crisp" type="checkbox"><span>锐利像素边缘</span></label>
          </fieldset>

          <fieldset class="panel"><legend><span class="section-number">04</span> 中心 Logo <span class="optional">可选</span></legend>
            <div class="logo-picker"><div class="logo-thumb" id="logo-thumb" aria-hidden="true">＋</div><div class="logo-description"><strong id="logo-name">未选择图片</strong><span>PNG、JPEG 或 WebP，最大 2 MiB</span></div><input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" class="visually-hidden"><label class="small-button upload-button" for="logo-file">选择图片</label><button type="button" class="text-button" id="remove-logo" hidden>移除</button></div>
            <div class="field-grid logo-options" id="logo-options">
              <div class="field"><label for="logo-scale">Logo 大小 <output id="logo-scale-value" for="logo-scale">19%</output></label><input id="logo-scale" type="range" min="5" max="25" step="1" value="19" disabled></div>
              <div class="field"><label for="logo-padding-px">留白（像素）</label><input id="logo-padding-px" type="number" min="0" max="128" step="1" value="1" inputmode="numeric" disabled></div>
            </div>
            <p class="field-note logo-hint">带 Logo 建议使用 H 级容错，并在最终展示条件下实际扫码确认。</p>
          </fieldset>
        </form>
      </section>

      <aside class="preview-pane" aria-labelledby="preview-title">
        <div class="preview-inner">
          <div class="preview-heading"><div><p class="eyebrow">RESULT / 02</p><h2 id="preview-title">实时预览</h2></div><div class="history-actions"><button type="button" class="icon-button" id="undo" title="撤销上次修改" aria-label="撤销上次修改" disabled>↶</button><button type="button" class="icon-button" id="redo" title="重做已撤销的修改" aria-label="重做已撤销的修改" disabled>↷</button></div></div>
          <div class="preview-card"><div class="preview-stage" id="preview-stage"><img id="preview-image" alt="生成的二维码预览" hidden><div id="preview-placeholder" class="preview-placeholder"><div class="placeholder-code" aria-hidden="true">▦</div><span>等待生成二维码</span></div></div></div>
          <div class="preview-meta"><span class="meta-dot" id="status-dot" aria-hidden="true"></span><p id="status" role="status" aria-live="polite">正在生成预览…</p></div>
          <p class="qr-details" id="qr-details" aria-live="polite"></p>
          <div class="download-actions"><button type="button" class="primary-button" id="download-png" disabled><span aria-hidden="true">↓</span> 导出 PNG</button><button type="button" class="secondary-button" id="download-svg" disabled><span aria-hidden="true">↓</span> 导出 SVG</button></div>
          <p class="preview-footnote">实际识别效果受尺寸、颜色、Logo 和展示环境影响。请用目标设备扫码确认。</p>
        </div>
      </aside>
    </main>
  </div>
</body>
</html>

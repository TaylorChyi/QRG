{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'link' %}<path d="M10 13a5 5 0 0 0 7 .1l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7-.1l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
  {% elif name == 'style' %}<path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
  {% elif name == 'image' %}<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
  {% elif name == 'settings' %}<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/><circle cx="12" cy="12" r="5"/>
  {% elif name == 'download' %}<path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/>
  {% elif name == 'undo' %}<path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 6 6v3"/>
  {% elif name == 'redo' %}<path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0-6 6v3"/>
  {% elif name == 'screen' %}<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>
  {% elif name == 'qr' %}<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h3v3h3m-6 3h3m3-6v-3M3 12h3m6-9v3m0 6h3m-3 6v3"/>
  {% endif %}
</svg>
{%- endmacro %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="在浏览器中制作和导出可定制的二维码。">
  <title>QRG</title>
  <link rel="icon" type="image/png" href="{{ url_for('icon') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='controls.css') }}">
  <script src="{{ url_for('static', filename='controls.js') }}" defer></script>
  <script src="{{ url_for('static', filename='logo-crop.js') }}" defer></script>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="QRG">
        <img class="brand-icon" src="{{ url_for('icon') }}" alt="" width="34" height="34">
        <span class="brand-name">QRG<span class="brand-period">.</span></span>
      </div>
      <div class="theme-control">{{ icon('screen') }}<span class="visually-hidden">界面外观</span><select id="theme" aria-label="界面外观"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
    </header>

    <main class="main-content">
      <h1 class="visually-hidden">二维码编辑器</h1>

      <div class="workspace-views" role="group" aria-label="工作区视图">
        <button type="button" data-view="editor" aria-pressed="true" aria-controls="editor">{{ icon('style') }} 编辑二维码</button>
        <button type="button" data-view="preview" aria-pressed="false" aria-controls="preview-pane">{{ icon('qr') }} 预览与导出</button>
      </div>
      <div class="workspace" data-view="editor">
        <section class="editor" id="editor" aria-label="二维码编辑器">
          <form id="editor-form" novalidate>
            <div class="field content-field"><div class="field-label"><label for="content">链接</label><output id="content-count" for="content">0 / 4096</output></div><textarea id="content" rows="2" placeholder="https://example.com" spellcheck="false" maxlength="4096"></textarea></div>
            <section class="field-section" aria-label="颜色">
              <div class="field-grid">
                <div class="field"><label for="color">码颜色</label><div class="colour-field"><input id="color" type="color" value="#000000"><output id="color-value" for="color">#000000</output></div></div>
                <div class="field"><label for="background">背景颜色</label><div class="colour-field"><input id="background" type="color" value="#ffffff"><input id="transparent" type="checkbox" hidden><output id="background-value" for="background">#FFFFFF</output></div></div>
              </div>
            </section>
            <section class="field-section" aria-label="形状">
              <div class="field-grid">
                <div class="field"><label for="module-shape">码点形状</label><select id="module-shape"><option value="square">方形</option><option value="tile" selected>圆角瓷砖</option><option value="circle">圆形</option></select></div>
                <div class="field"><label for="eye-shape">码眼形状</label><select id="eye-shape"><option value="square">方形</option><option value="rounded" selected>中圆角</option></select></div>
              </div>
            </section>
            <section class="field-section" aria-labelledby="logo-heading">
              <h2 id="logo-heading" class="section-heading">Logo</h2>
              <div class="logo-picker">
                <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" class="visually-hidden">
                <label class="small-button upload-button" for="logo-file" title="PNG、JPEG 或 WebP，最大 2 MiB"><span id="logo-placeholder" aria-hidden="true">{{ icon('image') }}</span><span class="logo-thumb" id="logo-thumb" aria-hidden="true" hidden></span><span id="logo-name">选择图片</span></label>
                <div class="logo-actions"><button type="button" class="text-button" id="edit-logo-crop" hidden>调整范围</button><button type="button" class="text-button" id="remove-logo" hidden>移除</button></div>
              </div>
              <div class="field-grid logo-options" id="logo-options" hidden>
                <div class="field"><label for="logo-modules">Logo 大小</label><select id="logo-modules" disabled><option value="5">5 × 5 格</option></select></div>
                <div class="field"><label for="logo-padding-modules">周围留白（码点）</label><select id="logo-padding-modules" disabled><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option></select></div>
              </div>
            </section>
            <section class="field-grid qr-settings" aria-label="二维码规格">
                <div class="field"><label for="error-correction">容错等级</label><select id="error-correction"><option value="L">L · 低</option><option value="M">M · 中</option><option value="Q">Q · 高</option><option value="H" selected>H · 最高</option></select></div>
                <div class="field"><label for="version">二维码版本</label><select id="version"><option value="auto">自动选择</option><option value="1">1 · 21 × 21</option><option value="3">3 · 29 × 29</option><option value="5">5 · 37 × 37</option><option value="10">10 · 57 × 57</option></select></div>
            </section>
          </form>
        </section>

        <aside class="preview-pane" id="preview-pane" aria-label="预览与导出">
          <div class="preview-toolbar"><div class="history-actions"><button type="button" class="icon-button" id="undo" data-tooltip="撤销上次修改" aria-label="撤销上次修改" disabled>{{ icon('undo') }}</button><button type="button" class="icon-button" id="redo" data-tooltip="重做已撤销的修改" aria-label="重做已撤销的修改" disabled>{{ icon('redo') }}</button></div></div>
          <div class="preview-canvas">
            <div class="preview-card"><div class="preview-stage" id="preview-stage"><img id="preview-image" alt="生成的二维码预览" hidden><div id="preview-placeholder" class="preview-placeholder">{{ icon('qr') }}<span>等待生成二维码</span></div></div></div>
          </div>
          <div class="export-panel">
            <p id="status" class="visually-hidden" role="status" aria-live="polite">正在生成预览…</p>
            <div class="field-grid export-settings">
              <div class="field"><label for="size">导出尺寸（像素）</label><select id="size"><option value="256">256</option><option value="512">512</option><option value="1024" selected>1024</option><option value="2048">2048</option><option value="4096">4096</option></select></div>
              <div class="field"><label for="margin">边距（码点）</label><select id="margin"><option value="0">0</option><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select></div>
            </div>
            <label class="check-row" for="crisp"><input id="crisp" type="checkbox" role="switch"><span>锐利像素边缘</span></label>
            <div class="download-actions"><button type="button" class="primary-button" id="download-png" disabled>{{ icon('download') }}<span>导出 PNG</span></button><button type="button" class="secondary-button" id="download-svg" disabled>{{ icon('download') }}<span>导出 SVG</span></button></div>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <dialog id="logo-crop-dialog" class="logo-crop-dialog" aria-labelledby="logo-crop-title" aria-describedby="logo-crop-note">
    <h2 id="logo-crop-title" class="crop-heading">裁剪 Logo</h2>
    <p id="logo-crop-note" class="visually-hidden">拖动框选，框内移动，四角缩放。</p>
    <div class="crop-workspace"><canvas id="logo-crop-canvas" tabindex="0" aria-label="Logo 裁剪范围" aria-describedby="crop-keyboard-note"></canvas></div>
    <p id="crop-keyboard-note" class="visually-hidden">方向键移动选区，Shift 加方向键每次移动 10 像素。</p>
    <fieldset class="crop-controls" aria-describedby="crop-edge-note">
      <legend>裁去（像素）</legend>
      <p id="crop-edge-note" class="visually-hidden">输入各边裁去的像素数，0 表示保留该边。</p>
      <div class="crop-fields">
        <div class="field"><label for="crop-top">上</label><input id="crop-top" type="number" min="0" step="1" inputmode="numeric"></div>
        <div class="field"><label for="crop-bottom">下</label><input id="crop-bottom" type="number" min="0" step="1" inputmode="numeric"></div>
        <div class="field"><label for="crop-left">左</label><input id="crop-left" type="number" min="0" step="1" inputmode="numeric"></div>
        <div class="field"><label for="crop-right">右</label><input id="crop-right" type="number" min="0" step="1" inputmode="numeric"></div>
      </div>
    </fieldset>
    <p id="crop-selection-size" class="visually-hidden" role="status" aria-live="polite"></p>
    <div class="crop-actions"><button type="button" class="text-button" id="reset-logo-crop">整张</button><div><button type="button" class="small-button" id="cancel-logo-crop">取消</button><button type="button" class="small-button crop-apply" id="apply-logo-crop">确定</button></div></div>
  </dialog>
</body>
</html>

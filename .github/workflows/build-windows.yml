name: Build QRG for Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build browser assets
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements-web.txt
          npm ci
          npm run test:sites
          npm run build
          python script/build-native-web --skip-build
      - name: Build Windows app
        shell: pwsh
        run: ./native/windows/build.ps1 -Runtime '${{ matrix.runtime }}' -Version '1.0.0'
      - name: Run Windows WebView2 smoke test
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'qrg-release-smoke'
          Expand-Archive -Path 'build/release/qrg-v1.0.0-windows-x64.zip' -DestinationPath $unpacked
          $app = Join-Path $unpacked 'QRG.exe'
          $check = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          Get-Content (Join-Path $unpacked 'smoke-test.log')
          if ($check.ExitCode -ne 0) { throw "Windows smoke test failed with code $($check.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: qrg-windows-${{ matrix.runtime }}
          path: build/release/qrg-v1.0.0-windows-*.zip
          if-no-files-found: error
